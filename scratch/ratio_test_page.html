<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>자산 비중 점검 테스트 페이지</title>
  <!-- Google Fonts: Inter & Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            headline: ['Outfit', 'sans-serif'],
          },
          boxShadow: {
            premium: '0 10px 30px -10px rgba(0, 0, 0, 0.04), 0 1px 1px rgba(0, 0, 0, 0.01)',
            cardHover: '0 20px 40px -15px rgba(99, 102, 241, 0.12), 0 1px 3px rgba(99, 102, 241, 0.04)',
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #f8fafc;
    }
    .glass-effect {
      background: rgba(255, 255, 255, 0.8);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
  </style>
</head>
<body class="font-sans antialiased text-slate-800 min-h-screen flex flex-col">
  <!-- 네비게이션 헤더 -->
  <header class="sticky top-0 z-40 w-full border-b border-slate-200/80 bg-white/80 backdrop-blur-md">
    <div class="max-w-7xl mx-auto px-6 h-16 flex items-center justify-between">
      <div class="flex items-center gap-2.5">
        <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-indigo-600 to-violet-500 flex items-center justify-center text-white shadow-md shadow-indigo-200">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M11 3.055A9.003 9.003 0 1020.945 13H11V3.055z"></path>
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M20.488 9H15V3.512A9.025 9.025 0 0120.488 9z"></path>
          </svg>
        </div>
        <span class="text-xl font-bold font-headline bg-clip-text text-transparent bg-gradient-to-r from-indigo-700 to-violet-600">AssetManager</span>
        <span class="text-xs font-semibold px-2 py-0.5 rounded-full bg-indigo-50 text-indigo-600 border border-indigo-100">비중 점검 Beta</span>
      </div>
      <div class="text-sm text-slate-500 font-medium">테스트 페이지 (Mock Data)</div>
    </div>
  </header>

  <!-- 메인 콘텐츠 -->
  <main class="flex-1 max-w-7xl w-full mx-auto px-6 py-10 flex flex-col gap-8">
    <!-- 타이틀 영역 -->
    <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
      <div>
        <h1 class="text-3xl font-extrabold font-headline text-slate-900 tracking-tight">자산 비중 점검</h1>
        <p class="text-slate-500 mt-1.5 text-sm md:text-base">포트폴리오의 자산군별 비중을 대분류, 중분류, 종목 단계로 드릴다운하여 다각도로 분석합니다.</p>
      </div>
      <button onclick="resetToTop()" class="px-4 py-2 text-sm font-semibold text-indigo-600 hover:text-indigo-700 bg-indigo-50 hover:bg-indigo-100/80 rounded-xl border border-indigo-100 transition-all flex items-center gap-2">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 1121.21 15H15V9"></path>
        </svg>
        전체 보기 (초기화)
      </button>
    </div>

    <!-- 카드 격자 구조 -->
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
      <!-- 왼쪽: 파이차트 카드 (7단) -->
      <div class="lg:col-span-7 bg-white rounded-3xl border border-slate-200/80 shadow-premium p-6 md:p-8 flex flex-col gap-6 transition-all hover:shadow-cardHover">
        <!-- Breadcrumb 탐색 경로 -->
        <div class="flex items-center gap-1.5 text-sm font-medium text-slate-500 overflow-x-auto py-1">
          <button onclick="zoomTo('root')" class="hover:text-indigo-600 transition-colors flex items-center gap-1 text-slate-400">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path>
            </svg>
            포트폴리오
          </button>
          
          <div id="breadcrumb-major-wrapper" class="hidden flex items-center gap-1.5">
            <span class="text-slate-300">/</span>
            <button id="breadcrumb-major" onclick="zoomTo('major')" class="hover:text-indigo-600 transition-colors font-semibold text-slate-700"></button>
          </div>

          <div id="breadcrumb-sub-wrapper" class="hidden flex items-center gap-1.5">
            <span class="text-slate-300">/</span>
            <span id="breadcrumb-sub" class="font-semibold text-slate-800"></span>
          </div>
        </div>

        <!-- 차트 영역 -->
        <div class="relative flex-1 flex items-center justify-center min-h-[360px] md:min-h-[400px]">
          <canvas id="ratioChart" class="max-w-[340px] md:max-w-[380px] w-full aspect-square"></canvas>
          
          <!-- 중앙 텍스트 정보 (도넛 차트의 가운데) -->
          <div class="absolute flex flex-col items-center justify-center pointer-events-none">
            <span id="center-label" class="text-xs font-semibold uppercase tracking-wider text-slate-400">총 자산</span>
            <span id="center-value" class="text-xl md:text-2xl font-black text-slate-900 font-headline mt-0.5">85,240,000원</span>
          </div>
        </div>

        <div class="text-center text-xs text-slate-400">
          💡 차트의 조각을 클릭하면 하위 카테고리 또는 종목 비중으로 깊이 있게 탐색(Drill-down)할 수 있습니다.
        </div>
      </div>

      <!-- 오른쪽: 자산 세부 정보 리스트 (5단) -->
      <div class="lg:col-span-5 flex flex-col gap-6">
        <!-- 요약 카드 -->
        <div class="bg-gradient-to-br from-slate-900 to-indigo-950 rounded-3xl text-white p-6 shadow-premium relative overflow-hidden">
          <div class="absolute -right-16 -bottom-16 w-44 h-44 rounded-full bg-indigo-500/10 blur-3xl"></div>
          <div class="absolute -left-10 -top-10 w-32 h-32 rounded-full bg-violet-500/10 blur-2xl"></div>
          
          <div class="relative z-10 flex flex-col gap-1.5">
            <span id="detail-title-label" class="text-xs font-bold uppercase tracking-wider text-indigo-300">선택된 포트폴리오</span>
            <h2 id="detail-title-name" class="text-2xl font-extrabold font-headline">전체 자산</h2>
            <div class="mt-4 pt-4 border-t border-white/10 flex items-baseline justify-between">
              <span class="text-sm text-slate-300">평가 금액</span>
              <span id="detail-valuation" class="text-2xl font-black font-headline text-emerald-400">85,240,000원</span>
            </div>
          </div>
        </div>

        <!-- 세부 목록 카드 -->
        <div class="bg-white rounded-3xl border border-slate-200/80 shadow-premium p-6 flex flex-col gap-4">
          <div class="flex items-center justify-between">
            <h3 id="table-title" class="font-bold text-slate-900 text-base">구성 항목 비중</h3>
            <span id="children-count" class="text-xs font-semibold px-2 py-0.5 rounded-full bg-slate-100 text-slate-500">4개 항목</span>
          </div>

          <div id="ratio-list" class="divide-y divide-slate-100 max-h-[350px] overflow-y-auto pr-1">
            <!-- 항목들이 자바스크립트로 동적 렌더링됩니다 -->
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- JS 데이터 및 로직 -->
  <script>
    // 1. Mock 데이터 정의 (계층형 자산 구조)
    // backend의 RatioService.get_hierarchy 구조와 매핑
    const assetHierarchy = [
      {
        category_name: "주식",
        category_type: "major",
        current_value: 45000000,
        current_ratio: 52.8,
        color: "#6366f1", // indigo-500
        hoverColor: "#4f46e5",
        children: [
          {
            category_name: "국내주식",
            category_type: "sub",
            current_value: 20000000,
            current_ratio: 44.4, // 주식 내 비중
            color: "#3b82f6", // blue-500
            hoverColor: "#2563eb",
            children: [
              { name: "삼성전자", ticker: "005930", valuation_krw: 15000000, current_ratio: 75.0, color: "#60a5fa" },
              { name: "SK하이닉스", ticker: "000660", valuation_krw: 5000000, current_ratio: 25.0, color: "#93c5fd" }
            ]
          },
          {
            category_name: "해외주식",
            category_type: "sub",
            current_value: 25000000,
            current_ratio: 55.6,
            color: "#8b5cf6", // violet-500
            hoverColor: "#7c3aed",
            children: [
              { name: "애플", ticker: "AAPL", valuation_krw: 12000000, current_ratio: 48.0, color: "#a78bfa" },
              { name: "엔비디아", ticker: "NVDA", valuation_krw: 8000000, current_ratio: 32.0, color: "#c4b5fd" },
              { name: "마이크로소프트", ticker: "MSFT", valuation_krw: 5000000, current_ratio: 20.0, color: "#ddd6fe" }
            ]
          }
        ]
      },
      {
        category_name: "배당주",
        category_type: "major",
        current_value: 22000000,
        current_ratio: 25.8,
        color: "#ec4899", // pink-500
        hoverColor: "#db2777",
        children: [
          {
            category_name: "미국배당",
            category_type: "sub",
            current_value: 15000000,
            current_ratio: 68.2,
            color: "#f43f5e", // rose-500
            hoverColor: "#e11d48",
            children: [
              { name: "SCHD", ticker: "SCHD", valuation_krw: 10000000, current_ratio: 66.7, color: "#fb7185" },
              { name: "리얼티인컴", ticker: "O", valuation_krw: 5000000, current_ratio: 33.3, color: "#fda4af" }
            ]
          },
          {
            category_name: "한국고배당",
            category_type: "sub",
            current_value: 7000000,
            current_ratio: 31.8,
            color: "#df82c4",
            hoverColor: "#d946ef",
            children: [
              { name: "맥쿼리인프라", ticker: "041440", valuation_krw: 7000000, current_ratio: 100.0, color: "#f0abfc" }
            ]
          }
        ]
      },
      {
        category_name: "현금",
        category_type: "major",
        current_value: 10240000,
        current_ratio: 12.0,
        color: "#14b8a6", // teal-500
        hoverColor: "#0d9488",
        children: [
          {
            category_name: "원화 현금",
            category_type: "sub",
            current_value: 6240000,
            current_ratio: 60.9,
            color: "#06b6d4", // cyan-500
            hoverColor: "#0891b2",
            children: [
              { name: "CMA 예수금", ticker: "CMA", valuation_krw: 6240000, current_ratio: 100.0, color: "#67e8f9" }
            ]
          },
          {
            category_name: "외화 현금",
            category_type: "sub",
            current_value: 4000000,
            current_ratio: 39.1,
            color: "#0ea5e9", // sky-500
            hoverColor: "#0284c7",
            children: [
              { name: "외화 예수금(USD)", ticker: "USD", valuation_krw: 4000000, current_ratio: 100.0, color: "#7dd3fc" }
            ]
          }
        ]
      },
      {
        category_name: "채권",
        category_type: "major",
        current_value: 8000000,
        current_ratio: 9.4,
        color: "#f59e0b", // amber-500
        hoverColor: "#d97706",
        children: [
          {
            category_name: "국채",
            category_type: "sub",
            current_value: 5000000,
            current_ratio: 62.5,
            color: "#eab308", // yellow-500
            hoverColor: "#ca8a04",
            children: [
              { name: "미국채 10년물 IEF", ticker: "IEF", valuation_krw: 5000000, current_ratio: 100.0, color: "#fde047" }
            ]
          },
          {
            category_name: "회사채",
            category_type: "sub",
            current_value: 3000000,
            current_ratio: 37.5,
            color: "#f97316", // orange-500
            hoverColor: "#ea580c",
            children: [
              { name: "회사채 액티브 ETF", ticker: "CORP_ETF", valuation_krw: 3000000, current_ratio: 100.0, color: "#ffedd5" }
            ]
          }
        ]
      }
    ];

    // 2. 상태 관리 변수
    let currentLevel = "root"; // "root", "major", "sub"
    let selectedMajorName = null;
    let selectedSubName = null;
    let chartInstance = null;

    // 포맷 도구
    function formatCurrency(val) {
      return new Intl.NumberFormat('ko-KR').format(Math.round(val)) + '원';
    }

    function formatPercent(val) {
      return (val || 0).toFixed(1) + '%';
    }

    // 총액 구하기
    function getRootTotal() {
      return assetHierarchy.reduce((sum, item) => sum + item.current_value, 0);
    }

    // 3. 차트 & 데이터 업데이트 핵심 함수
    function updateDashboard() {
      const rootTotal = getRootTotal();
      let currentValuation = rootTotal;
      let titleName = "전체 자산";
      let titleLabel = "선택된 포트폴리오";
      let chartData = [];
      let listData = [];

      // Breadcrumb 업데이트
      const breadMajorWrap = document.getElementById("breadcrumb-major-wrapper");
      const breadMajor = document.getElementById("breadcrumb-major");
      const breadSubWrap = document.getElementById("breadcrumb-sub-wrapper");
      const breadSub = document.getElementById("breadcrumb-sub");

      if (currentLevel === "root") {
        breadMajorWrap.classList.add("hidden");
        breadSubWrap.classList.add("hidden");

        titleName = "전체 자산";
        titleLabel = "포트폴리오 루트";
        currentValuation = rootTotal;

        // 대분류 데이터 매핑
        chartData = assetHierarchy.map(item => ({
          label: item.category_name,
          value: item.current_value,
          ratio: (item.current_value / rootTotal * 100),
          color: item.color,
          hoverColor: item.hoverColor,
          raw: item
        }));

        listData = [...chartData];
      } 
      else if (currentLevel === "major") {
        breadMajorWrap.classList.remove("hidden");
        breadSubWrap.classList.add("hidden");
        breadMajor.innerText = selectedMajorName;

        const majorNode = assetHierarchy.find(item => item.category_name === selectedMajorName);
        titleName = majorNode.category_name;
        titleLabel = "선택된 대분류";
        currentValuation = majorNode.current_value;

        // 중분류 데이터 매핑
        chartData = majorNode.children.map(item => ({
          label: item.category_name,
          value: item.current_value,
          ratio: (item.current_value / majorNode.current_value * 100),
          color: item.color,
          hoverColor: item.hoverColor,
          raw: item
        }));

        listData = [...chartData];
      } 
      else if (currentLevel === "sub") {
        breadMajorWrap.classList.remove("hidden");
        breadSubWrap.classList.remove("hidden");
        breadMajor.innerText = selectedMajorName;
        breadSub.innerText = selectedSubName;

        const majorNode = assetHierarchy.find(item => item.category_name === selectedMajorName);
        const subNode = majorNode.children.find(item => item.category_name === selectedSubName);
        titleName = subNode.category_name;
        titleLabel = `대분류: ${majorNode.category_name}`;
        currentValuation = subNode.current_value;

        // 종목 데이터 매핑
        chartData = subNode.children.map(item => ({
          label: item.name,
          value: item.valuation_krw,
          ratio: (item.valuation_krw / subNode.current_value * 100),
          color: item.color || "#cbd5e1",
          hoverColor: item.color || "#cbd5e1",
          ticker: item.ticker,
          raw: item
        }));

        listData = [...chartData];
      }

      // 우측 정보 패널 업데이트
      document.getElementById("detail-title-label").innerText = titleLabel;
      document.getElementById("detail-title-name").innerText = titleName;
      document.getElementById("detail-valuation").innerText = formatCurrency(currentValuation);
      document.getElementById("center-value").innerText = formatCurrency(currentValuation);
      document.getElementById("center-label").innerText = currentLevel === "root" ? "총 자산" : titleName;

      document.getElementById("table-title").innerText = `${titleName} 구성 비중`;
      document.getElementById("children-count").innerText = `${listData.length}개 항목`;

      // 리스트 목록 렌더링
      const listContainer = document.getElementById("ratio-list");
      listContainer.innerHTML = "";

      listData.sort((a, b) => b.value - a.value).forEach(item => {
        const itemRow = document.createElement("div");
        itemRow.className = "flex items-center justify-between py-3.5 group hover:bg-slate-50/60 transition-colors px-2 rounded-xl cursor-pointer";
        
        // 클릭 시 해당 항목으로 드릴다운
        itemRow.onclick = () => {
          if (currentLevel === "root") {
            zoomTo("major", item.label);
          } else if (currentLevel === "major") {
            zoomTo("sub", selectedMajorName, item.label);
          }
        };

        const hasSubText = item.ticker ? `(${item.ticker})` : '';

        itemRow.innerHTML = `
          <div class="flex items-center gap-3">
            <span class="w-3 h-3 rounded-full flex-shrink-0" style="background-color: ${item.color}"></span>
            <div class="flex flex-col">
              <span class="text-sm font-semibold text-slate-700 group-hover:text-indigo-600 transition-colors">${item.label} ${hasSubText}</span>
              <span class="text-xs text-slate-400 mt-0.5">${formatCurrency(item.value)}</span>
            </div>
          </div>
          <div class="flex items-center gap-1.5">
            <span class="text-sm font-bold font-headline text-slate-800">${formatPercent(item.ratio)}</span>
            ${currentLevel !== 'sub' ? `
              <svg class="w-4 h-4 text-slate-300 group-hover:text-indigo-400 group-hover:translate-x-0.5 transition-all" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 5l7 7-7 7"></path>
              </svg>
            ` : ''}
          </div>
        `;
        listContainer.appendChild(itemRow);
      });

      // 차트 재생성
      renderChart(chartData);
    }

    // 4. Chart.js 그리기 함수
    function renderChart(dataList) {
      const ctx = document.getElementById('ratioChart').getContext('2d');
      
      if (chartInstance) {
        chartInstance.destroy();
      }

      const labels = dataList.map(item => item.label);
      const dataValues = dataList.map(item => item.value);
      const colors = dataList.map(item => item.color);
      const hoverColors = dataList.map(item => item.hoverColor);

      chartInstance = new Chart(ctx, {
        type: 'doughnut',
        data: {
          labels: labels,
          datasets: [{
            data: dataValues,
            backgroundColor: colors,
            hoverBackgroundColor: hoverColors,
            borderWidth: 3,
            borderColor: '#ffffff',
            hoverOffset: 12
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: {
              display: false // 우측 리스트가 범례 역할을 하므로 숨김
            },
            tooltip: {
              callbacks: {
                label: function(context) {
                  const label = context.label || '';
                  const val = context.raw || 0;
                  const total = context.dataset.data.reduce((a, b) => a + b, 0);
                  const percentage = ((val / total) * 100).toFixed(1) + '%';
                  return ` ${label}: ${formatCurrency(val)} (${percentage})`;
                }
              },
              backgroundColor: '#1e293b',
              titleFont: { size: 13, weight: 'bold', family: 'Inter' },
              bodyFont: { size: 12, family: 'Inter' },
              padding: 12,
              cornerRadius: 12,
              displayColors: true,
              boxWidth: 8,
              boxHeight: 8,
              usePointStyle: true
            }
          },
          cutout: '72%', // 도넛 모양 안쪽 구멍 두께
          onClick: (event, activeElements) => {
            if (activeElements.length > 0) {
              const activeIndex = activeElements[0].index;
              const selectedItem = dataList[activeIndex];
              
              if (currentLevel === "root") {
                zoomTo("major", selectedItem.label);
              } else if (currentLevel === "major") {
                zoomTo("sub", selectedMajorName, selectedItem.label);
              }
            }
          }
        }
      });
    }

    // 5. 네비게이션 제어 (Drill-down 및 Reset)
    function zoomTo(level, majorName = null, subName = null) {
      if (level === "root") {
        currentLevel = "root";
        selectedMajorName = null;
        selectedSubName = null;
      } else if (level === "major") {
        currentLevel = "major";
        selectedMajorName = majorName;
        selectedSubName = null;
      } else if (level === "sub") {
        currentLevel = "sub";
        selectedMajorName = majorName;
        selectedSubName = subName;
      }
      updateDashboard();
    }

    function resetToTop() {
      zoomTo("root");
    }

    // 첫 실행
    window.addEventListener('DOMContentLoaded', () => {
      updateDashboard();
    });
  </script>
</body>
</html>
