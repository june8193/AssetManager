name: Deploy to Production

on:
  push:
    branches:
      - main

# 동시 배포 작업을 방지하기 위해 동시성 그룹 지정 (동일 워크플로우가 여러 번 실행될 경우 이전 실행 중단)
concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy & Restart Server
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Sync Backend Dependencies (uv)
        run: |
          uv sync

      - name: Install Frontend Dependencies (pnpm)
        working-directory: src/frontend
        run: |
          pnpm install

      - name: Reload Production Server via PM2
        run: |
          pm2 reload asset-manager-prod
