name: Deploy to Production

on:
  push:
    branches:
      - main

# 동시 배포 작업을 방지하기 위해 동시성 그룹 지정 (동일 워크플로우가 여러 번 실행될 경우 이전 실행 중단)
concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy & Restart Server
    runs-on: self-hosted

    steps:
      - name: Pull Latest Code and Deploy
        env:
          CI: "true"
        run: |
          export PATH="/opt/homebrew/bin:/opt/homebrew/sbin:/usr/local/bin:$HOME/.local/bin:$HOME/.cargo/bin:$PATH"
          cd /Users/seongeunhong/Desktop/local_repo/AssetManager
          git fetch origin main
          git reset --hard origin/main
          mkdir -p backups/logs
          uv sync
          cd src/frontend
          pnpm install --config.confirmModulesPurge=false --config.minimum-release-age=0
          cd /Users/seongeunhong/Desktop/local_repo/AssetManager
          pm2 startOrReload ecosystem.config.js --only asset-manager-prod
