[project]
name = "AssetManager"
version = "1.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.33.1",
    "fastapi",
    "uvicorn",
    "sqlalchemy",
    "httpx>=0.28.1",
    "python-dotenv>=1.2.2",
    "pytest-asyncio>=1.3.0",
    "yfinance>=1.3.0",
    "pandas>=2.0.0",
    "holidays>=0.25",
    "fastmcp>=3.4.4",
    "pytest-xdist>=3.5.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
norecursedirs = [".venv", "scratch", "scripts"]
addopts = "-v --tb=short"


[tool.pyright]
include = ["src"]
extraPaths = ["."]
